name: Refresh Context7 Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

# The Context7 library name is pinned, not derived from github.repository. The
# repository was renamed (etendo-go-docs -> etendo-docs); for a month every refresh
# asked for a name Context7 did not know, curl -s hid the library_not_found, and the
# index stayed frozen at 2026-09-29. On 2026-11-03 Context7 moved the library to
# /etendosoftware/etendo-docs (the old name now only redirects). The MCP `docs` tool
# of com.etendoerp.go reads the same name (Context7DocsClient.DEFAULT_BASE_URL):
# change both together.
env:
  CONTEXT7_LIBRARY: /etendosoftware/etendo-docs

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Context7 Refresh
        run: |
          response_body=$(mktemp)
          trap 'rm -f "$response_body"' EXIT
          http_code=$(curl -sS -o "$response_body" -w "%{http_code}" -X POST https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CONTEXT7_API_KEY }}" \
            -d "{\"libraryName\": \"${CONTEXT7_LIBRARY}\"}")
          cat "$response_body"
          if [[ "$http_code" == "400" ]] && jq -e '.error == "too-early"' "$response_body" > /dev/null 2>&1; then
            echo "Context7 refresh skipped: minimum update interval has not elapsed."
          elif [[ "$http_code" != 2?? ]]; then
            echo "::error::Context7 refresh failed (HTTP $http_code)."
            exit 1
          fi

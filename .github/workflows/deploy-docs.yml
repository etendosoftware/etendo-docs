name: Deploy docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup docs
        uses: ./.github/actions/setup-docs

      - name: Config user credentials
        run: |
          git config --local user.email "${{ secrets.ETENDOBOT_EMAIL }}"
          git config --local user.name "${{ secrets.ETENDOBOT_NAME }}"

      - name: Deploy docs
        run: mkdocs gh-deploy --force

      - name: Index docs in Algolia
        env:
          ALGOLIA_WRITE_INDEX_KEY: ${{ secrets.ALGOLIA_WRITE_INDEX_KEY }}
        run: >
          python algolia.py
          --app-id=XMLZ1ZZEY7
          --index-name=etendo_go_docs_index_es
          --docs-dir=docs/es
          --site-url=https://help.etendo.ai
          --locale=es

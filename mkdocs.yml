site_name: Etendo Academy
docs_dir: docs
site_url: https://etendosoftware.github.io/etendo-docs/
repo_url: https://github.com/etendosoftware/etendo-docs
repo_name: etendosoftware/etendo-docs
watch:
  - overrides
theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  font: false   # Plus Jakarta Sans y Space Mono se cargan en local (stylesheets/extra.css)
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.tabs.link
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/home.js

plugins:
  - search:
      lang: es
  - i18n:
      docs_structure: folder
      languages:
        - locale: es
          default: true
          name: Español
          build: true
          nav:
            - Inicio: index.md
            - Primeros pasos:
                - primeros-pasos/index.md
                - ¿Qué es Etendo?: primeros-pasos/que-es-etendo/que-es-etendo.md
                - Cómo crear tu cuenta: primeros-pasos/como-crear-tu-cuenta/como-crear-tu-cuenta.md
                - Navegar en Etendo: primeros-pasos/navegar-en-etendo/navegar-en-etendo.md
            - Comercial:
                - comercial/index.md
                - Contactos:
                    - ¿Qué es la sección Contactos?: comercial/contactos/que-es-la-seccion-contactos/que-es-la-seccion-contactos.md
                    - Cómo crear un contacto: comercial/contactos/como-crear-un-contacto/como-crear-un-contacto.md
                    - Importar contactos: comercial/contactos/importar-contactos/importar-contactos.md
                    - Gestionar tus contactos: comercial/contactos/gestionar-tus-contactos/gestionar-tus-contactos.md
                - Ventas:
                    - Introducción:
                        - ¿Qué es la sección Ventas?: comercial/ventas/que-es-la-seccion-ventas/que-es-la-seccion-ventas.md
                    - Gestión de ventas:
                        - Crear y gestionar presupuestos: comercial/ventas/crear-y-gestionar-presupuestos/crear-y-gestionar-presupuestos.md
                        - Crear y gestionar pedidos: comercial/ventas/crear-y-gestionar-pedidos/crear-y-gestionar-pedidos.md
                        - Crear y gestionar albaranes: comercial/ventas/crear-y-gestionar-albaranes/crear-y-gestionar-albaranes.md
                        - Crear una factura de venta: comercial/ventas/crear-una-factura-de-venta/crear-una-factura-de-venta.md
                        - Gestionar tus facturas de venta: comercial/ventas/gestionar-tus-facturas-de-venta/gestionar-tus-facturas-de-venta.md
                        - Enviar tus facturas por email: comercial/ventas/enviar-tus-facturas-por-email/enviar-tus-facturas-por-email.md
                        - Añadir pagos a tu factura de venta: comercial/ventas/anadir-pagos-a-tu-factura-de-venta/anadir-pagos-a-tu-factura-de-venta.md
                        - Crear y gestionar devoluciones: comercial/ventas/crear-y-gestionar-devoluciones/crear-y-gestionar-devoluciones.md
                    - Ventas - Preguntas frecuentes: comercial/ventas/documentos-de-venta-preguntas-frecuentes/documentos-de-venta-preguntas-frecuentes.md
            - Operaciones:
                - operaciones/index.md
                - Compras:
                    - ¿Qué es la sección Compras?: operaciones/compras/que-es-la-seccion-compras/que-es-la-seccion-compras.md
                    - Gestión de compras:
                        - Crear un pedido de compra: operaciones/compras/crear-un-pedido-de-compra/crear-un-pedido-de-compra.md
                        - Gestionar tus pedidos de compra: operaciones/compras/gestionar-tus-pedidos-de-compra/gestionar-tus-pedidos-de-compra.md
                        - Crear y gestionar albaranes de compra: operaciones/compras/crear-y-gestionar-albaranes-de-compra/crear-y-gestionar-albaranes-de-compra.md
                        - Crear una factura de compra: operaciones/compras/crear-una-factura-de-compra/crear-una-factura-de-compra.md
                        - Añadir pagos a tu factura de compra: operaciones/compras/anadir-pagos-a-tu-factura-de-compra/anadir-pagos-a-tu-factura-de-compra.md
                        - Gestionar tus facturas de compra: operaciones/compras/gestionar-tus-facturas-de-compra/gestionar-tus-facturas-de-compra.md
                        - Crear una devolución de compra: operaciones/compras/crear-una-devolucion-de-compra/crear-una-devolucion-de-compra.md
                - Inventario:
                    - ¿Qué es la sección Inventario?: operaciones/inventario/que-es-inventario/que-es-inventario.md
                    - Productos:
                        - operaciones/inventario/productos/index.md
                        - Crear un producto: operaciones/inventario/productos/crear-un-producto/crear-un-producto.md
                        - Importar productos: operaciones/inventario/productos/importar-productos/importar-productos.md
                        - Crear y configurar una categoría de producto: operaciones/inventario/productos/crear-una-categoria-de-producto/crear-una-categoria-de-producto.md
                        - Editar o eliminar un producto: operaciones/inventario/productos/editar-o-eliminar-un-producto/editar-o-eliminar-un-producto.md
                        - Gestionar tarifas de producto: operaciones/inventario/productos/gestionar-tarifas-de-producto/gestionar-tarifas-de-producto.md
                    - Almacén:
                        - operaciones/inventario/almacenes/index.md
                        - Crear un almacén: operaciones/inventario/almacenes/crear-un-almacen/crear-un-almacen.md
                    - Movimientos de stock:
                        - ¿Qué es la sección Inventario físico?: operaciones/inventario/inventario-fisico/inventario-fisico.md
                        - ¿Qué es la sección Consumo interno?: operaciones/inventario/consumo-interno/consumo-interno.md
                        - ¿Qué es la sección Movimiento entre almacenes?: operaciones/inventario/movimiento-de-almacenes/movimiento-de-almacenes.md
            - Finanzas:
                - finanzas/index.md
                - ¿Qué es la sección Finanzas?: finanzas/que-es-finanzas/que-es-finanzas.md
                - Glosario de Finanzas: finanzas/glosario-de-finanzas/glosario-de-finanzas.md
                - Cuentas:
                    - Añadir y configurar un banco, tarjeta o caja: finanzas/como-anadir-y-configurar-un-banco-tarjeta-o-caja/como-anadir-y-configurar-un-banco-tarjeta-o-caja.md
                    - Conectar, desconectar, archivar, desarchivar o eliminar una cuenta: finanzas/como-conectar-desconectar-desactivar-o-eliminar-una-cuenta-bancaria/como-conectar-desconectar-desactivar-o-eliminar-una-cuenta-bancaria.md
                    - Gestionar caja y movimientos en efectivo: finanzas/como-gestionar-caja-y-movimientos-en-efectivo/como-gestionar-caja-y-movimientos-en-efectivo.md
                - Pagos y cobros:
                    - Gestionar pagos y cobros: finanzas/como-gestionar-pagos-y-cobros/como-gestionar-pagos-y-cobros.md
                - Extracto bancario:
                    - Importar o descargar el extracto bancario: finanzas/como-importar-o-descargar-el-extracto-bancario/como-importar-o-descargar-el-extracto-bancario.md
                    - Borrar movimientos del extracto bancario: finanzas/como-borrar-transacciones-del-extracto-bancario/como-borrar-transacciones-del-extracto-bancario.md
                - Conciliación bancaria:
                    - ¿Qué es la conciliación bancaria en Etendo?: finanzas/que-es-la-conciliacion-bancaria-en-etendo/que-es-la-conciliacion-bancaria-en-etendo.md
                    - Conciliar o desconciliar movimientos contra documentos: finanzas/como-conciliar-o-desconciliar-movimientos-contra-documentos/como-conciliar-o-desconciliar-movimientos-contra-documentos.md
                    - Configurar reglas para automatizar la conciliación: finanzas/como-configurar-reglas-para-automatizar-la-conciliacion-bancaria/como-configurar-reglas-para-automatizar-la-conciliacion-bancaria.md
                - Activos y amortización:
                    - Apuntar un activo: finanzas/como-apuntar-un-activo/como-apuntar-un-activo.md
                    - "Activos: referencia de campos": finanzas/referencia-de-campos-de-activo/referencia-de-campos-de-activo.md
                    - Crear y ejecutar un plan de amortización: finanzas/como-crear-y-ejecutar-un-plan-de-amortizacion/como-crear-y-ejecutar-un-plan-de-amortizacion.md
            - Impuestos:
                - impuestos/index.md
                - ¿Qué puedes hacer en Impuestos?: impuestos/que-puedes-hacer-en-impuestos/que-puedes-hacer-en-impuestos.md
                - Glosario de Impuestos: impuestos/glosario-de-impuestos/glosario-de-impuestos.md
                - Cómo Activar un Modelo Tributario: impuestos/como-activar-un-modelo-tributario/como-activar-un-modelo-tributario.md
                - Tipos de Impuestos y sus Porcentajes: impuestos/tipos-de-impuestos-y-sus-porcentajes/tipos-de-impuestos-y-sus-porcentajes.md
                - SII: impuestos/sii/sii.md
                - TicketBAI: impuestos/ticketbai/ticketbai.md
                - VERI*FACTU: impuestos/verifactu/verifactu.md
                - Monitor Fiscal: impuestos/monitor-fiscal/monitor-fiscal.md
                - Modelo 303: impuestos/modelo-303/modelo-303.md
                - Modelo 349: impuestos/modelo-349/modelo-349.md
            - Sistema:
                - sistema/index.md
                - Configuración:
                    - Cómo gestionar tu organización: sistema/configuracion/como-gestionar-tu-organizacion/como-gestionar-tu-organizacion.md
                    - ¿Qué es la sección Roles y usuarios?: sistema/configuracion/que-es-roles-y-usuarios/que-es-roles-y-usuarios.md
                    - Cómo invitar a un usuario: sistema/configuracion/como-invitar-a-un-usuario/como-invitar-a-un-usuario.md
                    - Gestionar tus usuarios: sistema/configuracion/gestionar-tus-usuarios/gestionar-tus-usuarios.md
                    - Glosario de Roles y usuarios: sistema/configuracion/glosario-de-roles-y-usuarios/glosario-de-roles-y-usuarios.md

  - glightbox
  - tags
  - git-committers:
      repository: etendosoftware/etendo-docs
      branch: develop
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: true
      type: date
  - social

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/etendosoftware
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/81801932
      name: LinkedIn
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/etendo.ai/
      name: Instagram
  consent:
    title: Valoramos tu privacidad
    description: >-
      Utilizamos cookies y otras tecnologías de seguimiento para mejorar tu experiencia de navegación,
      mostrarte contenido personalizado, analizar el tráfico del sitio y entender de dónde provienen
      nuestros visitantes. Al hacer clic en "Aceptar", aceptas el uso de cookies.
      <a href="https://etendo.software/politica-de-cookies-2/" target="_blank">Política de cookies</a>
    actions:
      - accept
      - manage

copyright: Copyright &copy; 2021 - 2026 Futit Services S.L.

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

